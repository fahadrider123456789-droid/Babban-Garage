<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191919">

  <title>Babban Garage</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: light;
      --font: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif;
      --ink: #202020;
      --muted: #686961;
      --red: #c72c30;
      --line: #deded7;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background-color: #f3f2ee;
      background-image:
        radial-gradient(#20202012 0.8px, transparent 0.8px);
      background-size: 12px 12px;
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px 18px 60px;
    }

    h1, h2, h3 {
      color: var(--ink);
      line-height: 1.3;
      letter-spacing: -0.7px;
    }

    a { color: var(--red); }

    label {
      display: block;
      margin: 16px 0;
      font-weight: 700;
    }

    input, select, textarea, button { font: inherit; }

    input:not([type="hidden"]), select, textarea {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 14px;
      color: var(--ink);
      background: #fafaf7;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    input:focus, select:focus, textarea:focus {
      outline: 3px solid #c72c301c;
      border-color: var(--red);
    }

    textarea { min-height: 110px; resize: vertical; }

    button {
      padding: 13px 20px;
      color: white;
      background: var(--ink);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid #dc5d5d;
      outline-offset: 4px;
    }

    .notice {
      padding: 13px 17px;
      background: #fff2d9;
      color: #624b1f;
      border-radius: 12px;
    }

    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    [hidden] { display: none !important; }

    .garage {
      font-family: var(--font) !important;
      color: var(--ink) !important;
      background: transparent !important;
      padding: 0 !important;
      border-radius: 0 !important;
    }

    .garage h1, .garage h2, .garage h3,
    .garage input, .garage textarea,
    .garage button, .garage .card-number,
    .garage .registration, .garage .eyebrow {
      font-family: var(--font) !important;
    }

    .garage h1, .garage h2, .garage h3 {
      font-weight: 800 !important;
      letter-spacing: -0.8px !important;
    }

    .garage h2 {
      color: var(--ink) !important;
      font-size: clamp(23px, 4vw, 30px) !important;
    }

    .garage h3 { color: var(--ink) !important; }
    .garage .muted { color: var(--muted) !important; }

    .garage .hero {
      position: relative;
      overflow: hidden;
      padding: 32px !important;
      background: linear-gradient(125deg, #151515, #2c2c2a) !important;
      border: 1px solid #40403b !important;
      border-radius: 24px !important;
      box-shadow: 0 7px 0 #d2d1cb,
                  0 20px 35px #17171713 !important;
    }

    .garage .hero::after {
      content: "";
      position: absolute;
      top: 17px;
      right: 18px;
      width: 44px;
      height: 6px;
      background: var(--red);
      border-radius: 10px;
    }

    .garage .hero h1 {
      color: #f7f6ef !important;
      font-size: clamp(29px, 6vw, 42px) !important;
    }

    .garage .hero p { color: #d2d2c9 !important; }

    .garage .eyebrow {
      font-size: 10px !important;
      letter-spacing: 2px !important;
      font-weight: 800 !important;
    }

    .garage .hero .eyebrow { color: #e0b0b0 !important; }

    .garage .logout {
      background: #ffffff0c !important;
      border: 1px solid #66665f !important;
      color: white !important;
      box-shadow: none !important;
      border-radius: 999px !important;
    }

    .garage .nav {
      padding: 23px 2px !important;
      gap: 9px !important;
    }

    .garage .nav a {
      color: #292925 !important;
      background: #ffffffd9 !important;
      border: 1px solid #d8d8d0 !important;
      border-radius: 999px !important;
      padding: 11px 19px !important;
      font-size: 13px !important;
      box-shadow: 0 2px 0 #deded7;
    }

    .garage .nav a:first-child {
      color: white !important;
      background: var(--ink) !important;
      border-color: var(--ink) !important;
    }

    .garage .panel {
      background: #fffffff5 !important;
      border: 1px solid #deded7 !important;
      border-radius: 22px !important;
      padding: 27px !important;
      margin-bottom: 24px !important;
      box-shadow: 0 4px 0 #e5e4de,
                  0 12px 28px #19191904 !important;
    }

    .garage .panel-header {
      padding-bottom: 16px;
      border-bottom: 1px dashed #d9d9d0;
    }

    .garage input:not([type="hidden"]), .garage textarea {
      background: #f7f7f3 !important;
      color: var(--ink) !important;
      border: 1px solid #dcdcd4 !important;
      border-radius: 12px !important;
      padding: 15px !important;
      font-size: 16px !important;
    }

    .garage input::placeholder, .garage textarea::placeholder {
      color: #74756d !important;
    }

    .garage input:focus, .garage textarea:focus {
      border-color: #a24747 !important;
      outline: 3px solid #c72c3017 !important;
      background: white !important;
    }

    .garage button {
      color: white !important;
      background: var(--ink) !important;
      border-radius: 12px !important;
      box-shadow: 0 3px 0 #00000020 !important;
      font-size: 14px !important;
      font-weight: 800 !important;
    }

    .garage .submit {
      background: var(--red) !important;
      padding: 16px !important;
      border-radius: 999px !important;
      box-shadow: 0 4px 0 #942024 !important;
    }

    .garage .choice {
      background: #f3f3ed !important;
      color: var(--ink) !important;
      border: 1px solid #dcdcd3 !important;
      box-shadow: none !important;
      padding: 15px !important;
      overflow-wrap: anywhere;
    }

    .garage .details {
      background: #f0f2e9 !important;
      border: 1px solid #d6ddc9 !important;
      border-left: 4px solid #7b885d !important;
      border-radius: 13px !important;
    }

    /* RGB work cards */
    .garage .work-grid {
      gap: 26px !important;
      padding: 10px 4px 16px;
    }

    .garage .work-card {
      position: relative;
      isolation: isolate;
      background:
        linear-gradient(145deg, #ffffff, #f7f7fc) padding-box,
        linear-gradient(125deg,
          #f05e7b, #a26af5, #54a6ff, #51c9af, #efbf62
        ) border-box !important;
      border: 2px solid transparent !important;
      border-radius: 21px !important;
      padding: 23px !important;
      box-shadow:
        0 5px 0 #dedee8,
        -6px 8px 24px #aa64ee15,
        7px 11px 24px #439eff1c !important;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .garage .work-card:nth-child(even) {
      background:
        linear-gradient(145deg, #ffffff, #faf8f5) padding-box,
        linear-gradient(125deg,
          #51c9af, #54a6ff, #a26af5, #f05e7b, #efbf62
        ) border-box !important;
    }

    .garage .work-card:hover {
      transform: translateY(-3px);
      box-shadow:
        0 7px 0 #dedee8,
        -8px 12px 30px #aa64ee24,
        9px 15px 30px #439eff25 !important;
    }

    .garage .card-top {
      color: #62626b;
      padding-bottom: 14px;
      border-bottom: 1px dashed #d4d4dd;
    }

    .garage .card-number {
      color: white !important;
      background: #22222a !important;
      font-size: 11px !important;
      letter-spacing: .6px;
      border-radius: 8px !important;
      padding: 7px 10px !important;
    }

    .garage .registration {
      color: #262620 !important;
      background: #ffffff !important;
      border: 1px solid #babac5 !important;
      border-radius: 7px !important;
      font-size: 14px !important;
      letter-spacing: 1px !important;
      padding: 7px 11px !important;
    }

    .garage .work-text {
      border-top: 1px dashed #d4d4dd !important;
    }

    .garage .work-text p {
      font-size: 16px;
      line-height: 1.8;
    }

    .garage .record {
      background: #f8f8f4 !important;
      border: 1px solid #e0e0d8 !important;
      border-radius: 14px !important;
      padding: 19px !important;
    }

    /* Premium ten-digit mobile boxes */
    .garage .phone-boxes {
      gap: 5px !important;
      padding: 13px 8px 16px;
      background: linear-gradient(145deg, #edede7, #fafaf7);
      border: 1px solid #e2e2da;
      border-radius: 16px;
      box-shadow: inset 0 2px 5px #25252507;
    }

    .garage .phone-boxes input {
      min-width: 0 !important;
      margin: 0 !important;
      padding: 12px 0 !important;
      text-align: center !important;
      color: #24242a !important;
      background: linear-gradient(#ffffff, #f5f5f2) !important;
      border: 1px solid #d0d0ca !important;
      border-radius: 9px !important;
      font-size: 19px !important;
      font-weight: 800 !important;
      font-variant-numeric: tabular-nums;
      box-shadow:
        inset 0 1px 0 white,
        0 3px 0 #d4d4ce,
        0 5px 8px #1b1b1b0a !important;
      transition: border-color .15s ease, box-shadow .15s ease;
      caret-color: var(--red);
    }

    .garage .phone-boxes input:focus {
      outline: none !important;
      border-color: var(--red) !important;
      background: #ffffff !important;
      box-shadow:
        0 0 0 3px #c72c3017,
        0 3px 0 #c89191,
        0 6px 12px #c72c3012 !important;
    }

    .garage .notice {
      background: #f5efde !important;
      color: #675329 !important;
      border: 1px solid #e7dcc0 !important;
    }

    @media (max-width: 480px) {
      main { padding: 13px 11px 40px; }
      .garage .hero { padding: 26px 20px !important; }
      .garage .panel {
        padding: 20px 16px !important;
        border-radius: 18px !important;
      }
      .garage .phone-boxes {
        gap: 3px !important;
        padding: 11px 5px 14px;
      }
      .garage .phone-boxes input {
        font-size: 16px !important;
        padding: 11px 0 !important;
        border-radius: 7px !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .garage .work-card,
      .garage .phone-boxes input { transition: none; }
      .garage .work-card:hover { transform: none; }
    }

    @media print {
      body { background: white; }
      main { max-width: none; padding: 0; }
      button, nav, .notice { display: none !important; }
      .garage .work-card {
        break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #999 !important;
      }
    }
  </style>
</head>

<body>
  <main>
    {% block body %}
    {% endblock %}
  </main>
</body>
</html>
