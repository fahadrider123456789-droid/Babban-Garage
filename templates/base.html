<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Babban Garrage</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f6fa;
      color: #172c48;
      font: 17px system-ui, sans-serif;
      line-height: 1.5;
    }

    header {
      padding: 18px;
      background: #172c48;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 14px;
    }

    section, article {
      background: white;
      margin: 14px 0;
      padding: 16px;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    label { display: block; }

    input, select, textarea, button {
      width: 100%;
      margin: 7px 0;
      padding: 13px;
      border: 1px solid #bbc6d3;
      border-radius: 8px;
      font: inherit;
    }

    textarea { min-height: 100px; }

    button {
      background: #e46b16;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    a { color: #1358a0; }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0;
    }

    nav a {
      padding: 10px;
      background: white;
      border-radius: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .notice {
      padding: 12px;
      background: #fff1d5;
      border-radius: 8px;
    }

    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 10px; text-align: left; }
    small { color: #526477; }
    [hidden] { display: none !important; }

    @media print {
      button, nav, .notice { display: none !important; }
      body { background: white; }
      header { background: white; color: black; }
    }
  </style>
</head>

<body>
  <header>Babban Garrage</header>

  <main>
    {% for msg in get_flashed_messages() %}
      <p class="notice" role="status">{{ msg }}</p>
    {% endfor %}

    {% block body %}
    {% endblock %}
  </main>
</body>
</html>
